<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melaset</title>

  <!-- Bootstrap (solo CSS) -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <link rel="icon" type="image/x-icon" href="images/pepe.ico" />
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand mx-auto" href="https://github.com/cristiansacco/melaset" target="_blank" rel="noopener">
      Melaset – GitHub
    </a>
  </nav>

  <!-- Main -->
  <div class="main-wrapper py-3">
    <div class="topbar mb-3">
      <h3 class="m-0">Melaset</h3>

      <!-- Toggle: nascondi visitati -->
      <label class="toggle-wrap" title="Nascondi i pulsanti già cliccati oggi">
        <input id="hideVisited" type="checkbox" />
        <span class="toggle-ui"></span>
        <span class="toggle-text">Nascondi visitati</span>
      </label>
    </div>

    <div id="buttonContainer"></div>
  </div>

  <!-- Styles -->
  <style>
    body {
      background: #0d1016;
      color: #ffffff;
    }

    /* layout centrato */
    .main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    /* Toggle minimal */
    .toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      margin: 0;
    }

    .toggle-text {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .toggle-wrap input {
      display: none;
    }

    .toggle-ui {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      position: relative;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .toggle-ui::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      transition: left 0.15s ease;
    }

    .toggle-wrap input:checked + .toggle-ui {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.30);
    }

    .toggle-wrap input:checked + .toggle-ui::after {
      left: 22px;
    }

    /* === SEZIONI === */
    .section {
      margin: 18px 0 26px;
      padding: 14px 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);

      border-color: color-mix(in srgb, var(--accent, #fff) 35%, rgba(255, 255, 255, 0.08));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent, #fff) 18%, transparent);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .badge-count {
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent, #fff) 45%, rgba(255, 255, 255, 0.18));
      background: color-mix(in srgb, var(--accent, #fff) 12%, rgba(255, 255, 255, 0.05));
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    /* Tile */
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 12px;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.15);
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
      text-align: center;
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile:hover {
      transform: translateY(-2px);
      background: color-mix(in srgb, var(--accent, #fff) 10%, rgba(255, 255, 255, 0.06));
      border-color: color-mix(in srgb, var(--accent, #fff) 45%, rgba(255, 255, 255, 0.35));
    }

    /* Tile cliccata */
    .tile.active {
      background: color-mix(in srgb, var(--accent, #fff) 18%, rgba(0, 0, 0, 0.25));
      border-color: var(--accent, #fff);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent, #fff) 45%, transparent);
    }

    /* Nascondi visitati */
    .tile.is-hidden {
      display: none !important;
    }

    @media (max-width: 420px) {
      .grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
    }
  </style>

  <!-- Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      /* === RESET A MEZZANOTTE === */
      const todayKey = new Date().toISOString().slice(0, 10);
      const storedDay = localStorage.getItem("melaset-day");

      if (storedDay !== todayKey) {
        localStorage.removeItem("melaset-clicked");
        localStorage.removeItem("melaset-hideVisited");
        localStorage.setItem("melaset-day", todayKey);
      }

      const clicked = new Set(
        JSON.parse(localStorage.getItem("melaset-clicked") || "[]")
      );

      /* Toggle: nascondi visitati (persistente) */
      const hideVisitedToggle = document.getElementById("hideVisited");
      const savedHide = localStorage.getItem("melaset-hideVisited");
      hideVisitedToggle.checked = savedHide === "1";

      hideVisitedToggle.addEventListener("change", () => {
        localStorage.setItem("melaset-hideVisited", hideVisitedToggle.checked ? "1" : "0");
        applyHideVisited();
      });

      /* Accent per categoria */
      const ACCENTS = {
        words: "#ff9f1c",
        geo: "#2ecc71",
        movies: "#9b5de5",
        music: "#4cc9f0",
        games: "#ff4d6d",
        news: "#f4d35e",
        tools: "#a0aec0"
      };

      let allSites = [];

      Papa.parse("sites.csv", {
        download: true,
        header: true,
        complete: function (results) {
          allSites = (results.data || [])
            .filter(s => s && s.url && s.name && s.type)
            .map(s => ({
              url: s.url.trim(),
              name: s.name.trim(),
              type: s.type.trim().toLowerCase()
            }));

          render(allSites);
        },
        error: function (err) {
          console.error("CSV error:", err);
        }
      });

      function render(data) {
        const container = document.getElementById("buttonContainer");
        container.innerHTML = "";

        const groups = {};
        data.forEach(s => (groups[s.type] ||= []).push(s));

        // ordine categorie inverso
        Object.keys(groups).sort().reverse().forEach(type => {
          const section = document.createElement("div");
          section.className = "section";
          section.style.setProperty("--accent", ACCENTS[type] || "#ffffff");

          section.innerHTML = `
            <div class="section-header">
              <h5 class="section-title">${type.charAt(0).toUpperCase() + type.slice(1)}</h5>
              <span class="badge-count">${groups[type].length}</span>
            </div>
            <div class="grid"></div>
          `;

          const grid = section.querySelector(".grid");

          groups[type].forEach(site => {
            const a = document.createElement("a");
            a.className = "tile";
            a.href = site.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = site.name;

            const id = `${site.type}::${site.name}`;
            a.dataset.siteId = id;

            if (clicked.has(id)) a.classList.add("active");

            a.addEventListener("click", () => {
              clicked.add(id);
              localStorage.setItem("melaset-clicked", JSON.stringify([...clicked]));
              a.classList.add("active");
              applyHideVisited(); // se toggle attivo, nascondilo subito
            });

            grid.appendChild(a);
          });

          container.appendChild(section);
        });

        applyHideVisited();
      }

      function applyHideVisited() {
        const hide = hideVisitedToggle.checked;
        document.querySelectorAll(".tile").forEach(tile => {
          const id = tile.dataset.siteId;
          const isVisited = clicked.has(id);
          tile.classList.toggle("is-hidden", hide && isVisited);
        });

        // Se una sezione rimane senza tile visibili, la nascondiamo
        document.querySelectorAll(".section").forEach(section => {
          const anyVisible = section.querySelector(".tile:not(.is-hidden)");
          section.style.display = anyVisible ? "" : "none";
        });
      }
    });
  </script>

</body>
</html>
