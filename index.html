<div class="container-fluid px-3 py-3">

  <div class="topbar mb-3">
    <h3 class="m-0">Melaset</h3>
    <input id="search" class="form-control form-control-sm search"
           placeholder="Cerca un gioco / sito..." />
  </div>

  <div id="buttonContainer"></div>
</div>

<style>
  body { background:#0d1016; color:#fff; }

  .topbar{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
  }
  .search{
    max-width: 320px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color:#fff;
  }
  .search::placeholder{ color: rgba(255,255,255,0.55); }

  .section{
    margin: 18px 0 26px;
    padding: 14px 14px 18px;
    border-radius: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
  }

  .section-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom: 12px;
  }

  .section-title{
    margin:0;
    font-size: 1.05rem;
    letter-spacing: .5px;
    opacity: .95;
  }

  .badge-count{
    font-size: .8rem;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.05);
    opacity: .9;
  }

  /* GRID RESPONSIVE: si adatta da sola */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }

  /* Card link */
  .tile{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 14px 12px;
    border-radius: 12px;
    text-decoration:none;
    color:#fff;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.15);
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
    user-select:none;
    text-align:center;
    font-size: clamp(0.85rem, 1.8vw, 1rem);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .tile:hover{
    transform: translateY(-2px);
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.35);
  }

  /* se vuoi più compatto su finestre strette */
  @media (max-width: 420px){
    .grid{ grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

  let allSites = [];

  Papa.parse('sites.csv', {
    download: true,
    header: true,
    complete: function(results) {
      allSites = (results.data || [])
        .filter(s => s && s.url && s.name && s.type)
        .map(s => ({
          url: s.url.trim(),
          name: s.name.trim(),
          type: s.type.trim().toLowerCase()
        }));

      render(allSites);

      const search = document.getElementById('search');
      search.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        const filtered = allSites.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.type.toLowerCase().includes(q)
        );
        render(filtered);
      });
    },
    error: function(error) {
      console.error('Error parsing CSV:', error);
    }
  });

  function render(data){
    const container = document.getElementById('buttonContainer');
    container.innerHTML = "";

    // group by type
    const types = {};
    data.forEach(site => {
      (types[site.type] ||= []).push(site);
    });

    // render each section
    Object.keys(types).sort().forEach(type => {
      const section = document.createElement('div');
      section.className = "section";

      const title = type.charAt(0).toUpperCase() + type.slice(1);

      section.innerHTML = `
        <div class="section-header">
          <h5 class="section-title">${title}</h5>
          <span class="badge-count">${types[type].length}</span>
        </div>
        <div class="grid"></div>
      `;

      const grid = section.querySelector('.grid');

      types[type].forEach(site => {
        const a = document.createElement('a');
        a.className = "tile";
        a.href = site.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = site.name;
        grid.appendChild(a);
      });

      container.appendChild(section);
    });
  }

});
</script>
